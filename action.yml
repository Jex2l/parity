name: "Parity CI"
description: >
  Replays recent production traffic against this PR's build and posts
  the behavioral diff as a check run + PR comment. Fails the check only
  on real behavioral differences, not on unit-test gaps — see README.md.
author: "Jeel Patel"
branding:
  icon: "git-pull-request"
  color: "blue"

inputs:
  segment:
    description: "Path to the capture segment (.zst) to replay, relative to the repo root."
    required: true
  base-cmd:
    description: "Command that starts the BASE build (e.g. main branch), reading its port from --port-env."
    required: true
  candidate-cmd:
    description: "Command that starts the CANDIDATE build (this PR), reading its port from --port-env."
    required: true
  port-env:
    description: "Env var name the started process reads its listen port from."
    required: false
    default: "DEMO_ADDR"
  health-path:
    description: "HTTP path used to confirm a started build is ready."
    required: false
    default: "/health"
  sample:
    description: "Max number of recorded exchanges to replay (0 = all)."
    required: false
    default: "0"
  hmac-secret-env:
    description: "Env var holding the HMAC secret parity-capture used for scrubbing, if the segment is scrubbed."
    required: false
    default: ""
  github-token:
    description: "Token used to post the check run and PR comment. Needs `pull-requests: write` and `checks: write`."
    required: true
  check-name:
    description: "Name shown on the GitHub check run."
    required: false
    default: "Parity / behavioral diff"

outputs:
  conclusion:
    description: "success | failure | neutral"
    value: ${{ steps.post.outputs.conclusion }}

runs:
  using: "composite"
  steps:
    # Deliberately does NOT run actions/setup-go here: a consumer's own
    # workflow steps already need Go on PATH to build their base/candidate
    # commands before calling this action, and a second actions/setup-go
    # with caching enabled collides with the first one's already-populated
    # module cache (confirmed live: "tar: ... Cannot open: File exists" on
    # jex2l/parity PR #1 before this fix). If Go genuinely isn't set up
    # yet, add actions/setup-go to your own workflow before this step.
    - name: Build parity + parity-ci
      shell: bash
      run: |
        # -C (placed immediately after `build`, not at the end — see the
        # comment in examples/github-actions/parity-ci.yml for why order
        # matters) is required here, not optional: when a consumer repo
        # calls this action, github.action_path is parity's checked-out
        # code under _actions/, a completely different Go module
        # (github.com/jex2l/parity) than whatever module the consumer's
        # own working directory belongs to. `go build <path>` resolves
        # packages relative to the CURRENT module, so without -C this
        # fails with "directory ... outside main module or its selected
        # dependencies" — confirmed on a real install (jex2l/parity-labs'
        # widget-api test repo, PR #2) once self-testing within
        # jex2l/parity itself (where both happened to share one module)
        # stopped masking it.
        go build -C "${{ github.action_path }}" -o "$RUNNER_TEMP/parity" ./cmd/parity
        go build -C "${{ github.action_path }}" -o "$RUNNER_TEMP/parity-ci" ./cmd/parity-ci

    - name: Replay candidate against base
      shell: bash
      env:
        HMAC_SECRET_VALUE: ${{ env[inputs.hmac-secret-env] }}
      run: |
        ARGS=(
          replay
          --segment "${{ inputs.segment }}"
          --base-cmd "${{ inputs.base-cmd }}"
          --candidate-cmd "${{ inputs.candidate-cmd }}"
          --port-env "${{ inputs.port-env }}"
          --health-path "${{ inputs.health-path }}"
          --sample "${{ inputs.sample }}"
          --out "$RUNNER_TEMP/parity-report.json"
        )
        if [ -n "${{ inputs.hmac-secret-env }}" ]; then
          ARGS+=(--hmac-secret-env "${{ inputs.hmac-secret-env }}")
        fi
        # Exit code is informational here; parity-ci below re-derives the
        # same outcome from report.json so the workflow's pass/fail comes
        # from one place, not two commands disagreeing.
        "$RUNNER_TEMP/parity" "${ARGS[@]}" || true

    - name: Post results to the PR
      id: post
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        PR_NUMBER="${{ github.event.pull_request.number }}"
        # set +e matters: this step's shell runs under `set -e` (GitHub
        # Actions' default for a `run:` block), so without disabling it
        # a non-zero exit from parity-ci (10/20/30 are all expected,
        # meaningful outcomes, not shell errors) kills the script on this
        # line, before `code=$?` below ever runs — confirmed live on
        # jex2l/parity PR #1: a correct, successfully-posted "neutral"
        # (low-confidence) result still made this step report failure,
        # because `code=$?` never executed. (A trailing `|| true` on the
        # command instead would "fix" the symptom but always set $? to 0,
        # losing the real exit code entirely — tried that first, it's
        # wrong; set +e/-e around the call is the correct fix.)
        set +e
        "$RUNNER_TEMP/parity-ci" \
          --report "$RUNNER_TEMP/parity-report.json" \
          --owner "${{ github.repository_owner }}" \
          --repo "${{ github.event.repository.name }}" \
          --pr "$PR_NUMBER" \
          --sha "${{ github.event.pull_request.head.sha }}" \
          --token-env GITHUB_TOKEN \
          --check-name "${{ inputs.check-name }}" \
          --changed-files "$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}... | paste -sd, -)" \
          --pr-title "${{ github.event.pull_request.title }}"
        code=$?
        set -e
        case $code in
          0)  echo "conclusion=success" >> "$GITHUB_OUTPUT" ;;
          10) echo "conclusion=failure" >> "$GITHUB_OUTPUT" ;;
          20) echo "conclusion=neutral" >> "$GITHUB_OUTPUT" ;;
          *)  echo "conclusion=error" >> "$GITHUB_OUTPUT"; exit $code ;;
        esac
        # Fail the workflow step itself only on real unintended diffs
        # (10), not on a low-confidence replay (20, informational).
        if [ "$code" -eq 10 ]; then
          exit 1
        fi
