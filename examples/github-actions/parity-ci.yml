# Example consumer workflow for action.yml (docs/plans/phase-8-parity-ci.md).
# Copy into .github/workflows/ in a repo that already has a parity-capture
# segment checked in (or fetched as a prior step) and knows how to start
# its own base/candidate builds.
#
# **Use the `uses:` tag below as the source of truth for the latest
# validated version** — this comment itself went stale once already
# (it kept citing v0.1.0 — the version confirmed BROKEN on any real
# install — through two rounds of fixes, because bumping the `uses:`
# line and updating this comment were two different edits and the
# first one got missed). See docs/plans/phase-8-parity-ci.md for the
# full history: v0.1.0 fails outright on a real install, v0.1.1 installs
# but fails its check on every PR regardless of classification, v0.1.2
# fixed that, v0.1.3 adds grounded (diff-evidence-based) classification.
name: parity-ci

on:
  pull_request:

permissions:
  pull-requests: write
  checks: write

jobs:
  behavioral-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: parity-ci derives --changed-files from it

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build base (the PR's base branch) and candidate (this PR)
        run: |
          git worktree add /tmp/base "origin/${{ github.event.pull_request.base.ref }}"
          go build -C /tmp/base -o /tmp/base-build ./...
          go build -o /tmp/candidate-build .

      - uses: jex2l/parity@v0.1.3 # pin to a release tag; see https://github.com/Jex2l/parity/releases
        with:
          segment: ./segments/latest.zst
          base-cmd: /tmp/base-build
          candidate-cmd: ./candidate-build
          github-token: ${{ secrets.GITHUB_TOKEN }}
