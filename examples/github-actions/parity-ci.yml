# Example consumer workflow for action.yml (docs/plans/phase-8-parity-ci.md).
# Copy into .github/workflows/ in a repo that already has a parity-capture
# segment checked in (or fetched as a prior step) and knows how to start
# its own base/candidate builds. Validated end-to-end against a real
# GitHub Actions run on jex2l/parity PR #1 (now closed) — that run found
# and fixed 3 real bugs across this file and action.yml, including this
# file originally hardcoding `origin/main`, which fails on any repo whose
# default branch isn't named "main" (this repo's own default is
# "master"). Now derives the base branch from the PR event instead.
name: parity-ci

on:
  pull_request:

permissions:
  pull-requests: write
  checks: write

jobs:
  behavioral-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: parity-ci derives --changed-files from it

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build base (the PR's base branch) and candidate (this PR)
        run: |
          git worktree add /tmp/base "origin/${{ github.event.pull_request.base.ref }}"
          go build -o /tmp/base-build ./... -C /tmp/base
          go build -o /tmp/candidate-build .

      - uses: jex2l/parity@main # pin to a release tag in a real adopting repo
        with:
          segment: ./segments/latest.zst
          base-cmd: /tmp/base-build
          candidate-cmd: ./candidate-build
          github-token: ${{ secrets.GITHUB_TOKEN }}
